<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Performance: Preconnect to critical external domains -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://firebase.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://checkout.razorpay.com" crossorigin>
    <link rel="dns-prefetch" href="https://checkout.razorpay.com">
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <!-- Performance: Resource hints -->
    <meta http-equiv="x-dns-prefetch-control" content="on">
    <title>Enqir.in</title>
    <meta name="description" content="Connecting verified buyers and sellers through trusted, curated demand and supply." />
    <meta name="author" content="Enqir.in" />
    
    <!-- Favicon and App Icons - Enqir.in Branding (Black and White) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=3" />
    
    <!-- Google Fonts - load only used weights with font-display:swap for instant text.
         ⚡ Performance: loaded asynchronously (media=print/onload swap) so font CSS
         never blocks first paint — text renders immediately in system fonts and
         swaps to Inter/Manrope when ready. Visual result identical. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@700;800&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@700;800&display=swap"></noscript>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://enqir.in" />
    <meta property="og:title" content="Enqir.in - AI-powered demand-driven marketplace" />
    <meta property="og:description" content="Connecting verified buyers and sellers through trusted, curated demand and supply." />
    <meta property="og:site_name" content="Enqir.in" />
    <meta property="og:image" content="https://enqir.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Enqir.in - AI-powered demand-driven marketplace" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Enqir.in - AI-powered demand-driven marketplace" />
    <meta name="twitter:description" content="Connecting verified buyers and sellers through trusted, curated demand and supply." />
    <meta name="twitter:image" content="https://enqir.in/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Friendly fallback when the app's scripts fail to load (e.g. the site
      // was updated while this page sat in the browser cache). This runs
      // before React, so it covers failures the app's ErrorBoundary can't see.
      (function () {
        var shown = false;
        function showRefreshScreen() {
          if (shown || document.getElementById('enqir-load-fallback')) return;
          shown = true;
          var style = document.createElement('style');
          style.textContent = '@keyframes enqirFbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.enqir-fb-doodle{position:absolute;animation:enqirFbFloat 5s ease-in-out infinite;pointer-events:none}.enqir-fb-btn:active{transform:translateY(3px) !important;box-shadow:0 1px 0 0 rgba(0,0,0,0.85) !important;}'
          document.head.appendChild(style);
          var d = document.createElement('div');
          d.id = 'enqir-load-fallback';
          d.setAttribute('style', 'position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#f8fafc,#f1f5f9);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:16px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));');
          var doodle = function (svg, style, delay) { return '<div class="enqir-fb-doodle" style="' + style + ';animation-delay:' + (delay || 0) + 's">' + svg + '</div>'; };
          var S = 'fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
          d.innerHTML = ''
            // Floating doodle icons around the card — same visual language as the app's recovery screen
            + doodle('<svg width="34" height="34" viewBox="0 0 64 64" ' + S + '><path d="M12 18c0-4 3-7 7-7h26c4 0 7 3 7 7v14c0 4-3 7-7 7H29l-10 9v-9h-2c-3 0-5-3-5-7z"/><circle cx="25" cy="25" r="2" fill="#111827"/><circle cx="32" cy="25" r="2" fill="#111827"/><circle cx="39" cy="25" r="2" fill="#111827"/></svg>', 'top:9%;right:9%;transform:rotate(6deg);opacity:.75', 0)
            + doodle('<svg width="30" height="30" viewBox="0 0 64 64" ' + S + '><circle cx="32" cy="32" r="19"/><path d="M24 22h16M24 28h16M30 22c6 0 9 2 9 6s-3 6-9 6l11 10"/></svg>', 'top:34%;left:7%;transform:rotate(-10deg);opacity:.7', 1.2)
            + doodle('<svg width="26" height="26" viewBox="0 0 64 64" ' + S + '><path d="M34 6L16 36h12l-4 22 22-32H34z"/></svg>', 'bottom:15%;left:12%;transform:rotate(12deg);opacity:.7', 0.6)
            + doodle('<svg width="30" height="30" viewBox="0 0 64 64" ' + S + '><path d="M16 10h20l10 10v34H16z"/><path d="M36 10v10h10"/><path d="M23 30h16M23 36h16M23 42h9"/></svg>', 'bottom:10%;right:10%;transform:rotate(-6deg);opacity:.75', 1.8)
            + doodle('<svg width="26" height="26" viewBox="0 0 64 64" ' + S + '><rect x="22" y="8" width="20" height="48" rx="5"/><path d="M28 13h8"/><circle cx="32" cy="49" r="2.5" fill="#111827"/></svg>', 'top:12%;left:5%;transform:rotate(-10deg);opacity:.6', 0.9)
            + doodle('<svg width="26" height="26" viewBox="0 0 64 64" ' + S + '><circle cx="32" cy="32" r="20"/><path d="M32 20v12l8 6"/></svg>', 'top:4%;left:40%;transform:rotate(-8deg);opacity:.6', 1.5)
            + doodle('<svg width="24" height="24" viewBox="0 0 64 64" ' + S + '><path d="M32 52S12 40 12 26a10 10 0 0 1 20-3 10 10 0 0 1 20 3c0 14-20 26-20 26z"/></svg>', 'bottom:6%;left:8%;transform:rotate(-6deg);opacity:.6', 2.1)
            + doodle('<svg width="26" height="26" viewBox="0 0 64 64" ' + S + '><rect x="12" y="18" width="40" height="28" rx="5"/><path d="M12 22l20 14 20-14"/></svg>', 'bottom:4%;right:36%;transform:rotate(6deg);opacity:.55', 0.3)
            + doodle('<svg width="18" height="18" viewBox="0 0 32 32" ' + S + '><path d="M16 4l2.5 7.5L26 14l-7.5 2.5L16 24l-2.5-7.5L6 14l7.5-2.5z"/></svg>', 'top:22%;right:20%;transform:rotate(12deg);opacity:.5', 0.7)
            + doodle('<svg width="14" height="14" viewBox="0 0 32 32" ' + S + '><path d="M16 4l2.5 7.5L26 14l-7.5 2.5L16 24l-2.5-7.5L6 14l7.5-2.5z"/></svg>', 'bottom:30%;left:22%;transform:rotate(-12deg);opacity:.45', 1.1)
            + doodle('<svg width="26" height="26" viewBox="0 0 64 64" ' + S + '><path d="M32 56s16-14 16-27A16 16 0 0 0 16 29c0 13 16 27 16 27z"/><circle cx="32" cy="28" r="6"/></svg>', 'top:44%;right:6%;transform:rotate(8deg);opacity:.6', 1.4)
            + '<div style="max-width:20rem;width:100%;background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(15,23,42,.12);border:2px solid #e2e8f0;padding:28px 20px;text-align:center;position:relative;">'
            + '<div style="font-size:52px;font-weight:800;letter-spacing:-0.025em;color:#2563eb;line-height:1;margin-bottom:24px;">Enqir</div>'
            + '<button onclick="window.location.href=&quot;/&quot;" class="enqir-fb-btn" style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border:1.5px solid #000;border-radius:14px;background:#2563eb;color:#fff;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 0 rgba(0,0,0,0.85);transition:all .15s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;">Refresh Now</button>'
            + '</div>';
          document.body.appendChild(d);
        }
        // Resource-load failures (script/link tags) fire as capture-phase errors.
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
            showRefreshScreen();
          }
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
