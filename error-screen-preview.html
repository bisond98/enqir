<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Enqir — Refresh Screen Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(to bottom right, #f8fafc, #f1f5f9);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 16px;
    position: relative;
    overflow-x: hidden;
  }
  .doodles { position: absolute; inset: 0; pointer-events: none; }
  .d { position: absolute; color: rgba(17,24,39,.8); }
  .d svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .d-chat { top: 8%; right: 6%; width: 36px; height: 36px; transform: rotate(6deg); animation: float 5s ease-in-out infinite; }
  .d-mega { top: 38%; left: 4%; width: 36px; height: 36px; transform: rotate(-10deg); color: rgba(17,24,39,.7); animation: float 7s ease-in-out 1.2s infinite; }
  .d-hand { bottom: 28%; left: 3%; width: 36px; height: 36px; transform: rotate(-6deg); color: rgba(17,24,39,.7); animation: float 7s ease-in-out 1.2s infinite; }
  .d-rupee { top: 36%; right: 5%; width: 32px; height: 32px; transform: rotate(8deg); color: rgba(17,24,39,.7); animation: float 5s ease-in-out infinite; }
  .d-enq { bottom: 12%; right: 8%; width: 36px; height: 36px; transform: rotate(-6deg); animation: float 5s ease-in-out infinite; }
  .d-bolt { bottom: 16%; left: 28%; width: 22px; height: 22px; transform: rotate(12deg); animation: float 5s ease-in-out infinite; }
  .s1 { top: 3%; left: 6%; width: 16px; height: 16px; transform: rotate(12deg); }
  .s2 { bottom: 40%; left: 6%; width: 12px; height: 12px; transform: rotate(-12deg); }
  .s3 { top: 55%; left: 13%; width: 10px; height: 10px; transform: rotate(45deg); color: rgba(17,24,39,.5); }
  .s4 { top: 60%; right: 14%; width: 10px; height: 10px; transform: rotate(-12deg); color: rgba(17,24,39,.5); }
  .p1 { top: 30%; left: 10%; width: 14px; height: 14px; transform: rotate(12deg); }
  .p2 { bottom: 44%; right: 8%; width: 12px; height: 12px; transform: rotate(-6deg); }
  .r1 { bottom: 18%; right: 16%; width: 12px; height: 12px; transform: rotate(12deg); }
  .r2 { top: 10%; left: 16%; width: 10px; height: 10px; transform: rotate(-12deg); color: rgba(17,24,39,.45); }
  .st1 { top: 66%; left: 8%; width: 16px; height: 16px; transform: rotate(45deg); }
  .st2 { top: 20%; right: 12%; width: 16px; height: 16px; transform: rotate(12deg); color: rgba(17,24,39,.5); }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }

  /* ===== Shared card + typography ===== */
  .card {
    max-width: 24rem;
    width: 100%;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
    border: 2px solid #e2e8f0;
    padding: 32px 20px;
    text-align: center;
    position: relative;
  }
  @media (min-width: 640px) { .card { border-radius: 24px; padding: 56px 48px; } }
  .logo {
    color: #2563eb;
    font-weight: 800;
    letter-spacing: -0.025em;
    line-height: 1;
    font-size: 36px;
    margin-bottom: 8px;
  }
  @media (min-width: 640px) { .logo { font-size: 44px; margin-bottom: 10px; } }
  .expired {
    font-size: 15px;
    color: #334155;
    margin-bottom: 40px;
  }
  @media (min-width: 640px) { .expired { font-size: 17px; margin-bottom: 56px; } }

  /* ===== Shared compact button ===== */
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: fit-content;
    max-width: 100%;
    margin: 0 auto;
    height: 48px;
    font-size: 15px;
    font-weight: 800;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    background: #2563eb;
    color: #fff;
    border: 1.5px solid #000;
    box-shadow: 0 4px 0 0 rgba(0,0,0,0.85);
    padding: 0 28px;
    font-family: inherit;
  }
  @media (min-width: 640px) { .btn { height: 52px; font-size: 16px; padding: 0 32px; } }
  .btn:active { box-shadow: 0 1px 0 0 rgba(0,0,0,0.85); transform: translateY(3px); }
  .btn svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* ===== Screen label (preview-only, not part of the design) ===== */
  .screen-label {
    position: relative;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #64748b;
    background: #fff;
    border: 1.5px solid #cbd5e1;
    border-radius: 999px;
    padding: 6px 14px;
  }
</style>
</head>
<body>
  <div class="doodles">
    <div class="d d-chat"><svg viewBox="0 0 64 64"><path d="M12 18c0-4 3-7 7-7h26c4 0 7 3 7 7v14c0 4-3 7-7 7H29l-10 9v-9h-2c-3 0-5-3-5-7z"/><circle cx="25" cy="25" r="2" fill="currentColor"/><circle cx="32" cy="25" r="2" fill="currentColor"/><circle cx="39" cy="25" r="2" fill="currentColor"/></svg></div>
    <div class="d d-mega"><svg viewBox="0 0 64 64"><path d="M12 30v8c0 1.5 1 2.5 2.5 2.5H20l4 11c.4 1.3 1.7 2.2 3 1.8 1.4-.4 2.2-1.7 1.8-3L25.5 40.5H32z"/><path d="M32 26L20 30v8l12 4c4 1.2 7-1 8-5s-.5-9-4-11z"/><path d="M46 20l3-5M50 30l6-1M47 40l4 3" stroke-dasharray="2 4"/></svg></div>
    <div class="d d-hand"><svg viewBox="0 0 64 64"><path d="M6 26l10-6 12 4 12-4 10 6"/><path d="M16 20v16l10 8c2 1.5 4 1 5.5-.5L42 34c1.5-1.5 1-4-1-5"/><path d="M16 36h-6V20"/><path d="M48 20v16h-6"/><path d="M28 30l4 4M34 28l4 4"/></svg></div>
    <div class="d d-rupee"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="19"/><path d="M24 22h16M24 28h16M30 22c6 0 9 2 9 6s-3 6-9 6l11 10"/></svg></div>
    <div class="d d-enq"><svg viewBox="0 0 64 64"><path d="M16 10h20l10 10v34H16z"/><path d="M36 10v10h10"/><path d="M23 30h16M23 36h16M23 42h9"/><path d="M47 51l7-7 4 4-7 7-5 1z"/></svg></div>
    <div class="d d-bolt"><svg viewBox="0 0 64 64"><path d="M34 6L16 36h12l-4 22 22-32H34z"/></svg></div>
    <div class="d s1"><svg viewBox="0 0 32 32"><path d="M16 4l2.5 7.5L26 14l-7.5 2.5L16 24l-2.5-7.5L6 14l7.5-2.5z"/></svg></div>
    <div class="d s2"><svg viewBox="0 0 32 32"><path d="M16 4l2.5 7.5L26 14l-7.5 2.5L16 24l-2.5-7.5L6 14l7.5-2.5z"/></svg></div>
    <div class="d s3"><svg viewBox="0 0 32 32"><path d="M16 4l2.5 7.5L26 14l-7.5 2.5L16 24l-2.5-7.5L6 14l7.5-2.5z"/></svg></div>
    <div class="d s4"><svg viewBox="0 0 32 32"><path d="M16 4l2.5 7.5L26 14l-7.5 2.5L16 24l-2.5-7.5L6 14l7.5-2.5z"/></svg></div>
    <div class="d p1"><svg viewBox="0 0 32 32"><path d="M16 7v18M7 16h18" stroke-width="2.5"/></svg></div>
    <div class="d p2"><svg viewBox="0 0 32 32"><path d="M16 7v18M7 16h18" stroke-width="2.5"/></svg></div>
    <div class="d r1"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10"/></svg></div>
    <div class="d r2"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10"/></svg></div>
    <div class="d st1"><svg viewBox="0 0 32 32"><path d="M16 3l3 7 7 1-5 5 1.5 7-6.5-3.5L9.5 23 11 16 6 11l7-1z"/></svg></div>
    <div class="d st2"><svg viewBox="0 0 32 32"><path d="M16 3l3 7 7 1-5 5 1.5 7-6.5-3.5L9.5 23 11 16 6 11l7-1z"/></svg></div>
  </div>

  <!-- Screen 1: form pages — session expired + refresh -->
  <div class="screen-label">Form pages — session expired</div>
  <div class="card">
    <div class="logo">Enqir</div>
    <div class="expired">Your session expired</div>
    <button class="btn" onclick="alert('Form pages: redirects to https://www.enqir.in')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      Refresh Page
    </button>
  </div>

  <!-- Screen 2: all other pages — heading + refresh only -->
  <div class="screen-label">All other pages — refresh</div>
  <div class="card">
    <div class="logo">Enqir</div>
    <div class="expired">Something went wrong</div>
    <button class="btn" onclick="alert('Other pages: reloads the same page with a cache-buster')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      Refresh Now
    </button>
  </div>
</body>
</html>
